name: my_logs
description: "Logspad — Personal Tracker Hub. Track media, books, tasks, notes and learning paths."
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.6.1

  # Models (freezed + json_serializable)
  freezed_annotation: ^2.4.0
  json_annotation: ^4.9.0

  # Images
  cached_network_image: ^3.4.1

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Fonts
  google_fonts: ^6.2.0

  # Backend & Cloud
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  collection: ^1.19.1
  http: ^1.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true
  assets:
    - shorebird.yaml
    - assets/Logo.jpg
    - assets/Logo.png
